name: jellyfin-android release

on:
  workflow_dispatch:

# 创建 Release 需要 contents 写权限
permissions:
  contents: write

# 同一时间只允许一个发布任务，排队执行而不是互相抢占
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: sukerxi/jellyfin-android
          ref: master
          fetch-depth: 0 # 必须获取完整历史，否则 git rev-parse 可能失败

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本号 = 3.0.0 + Git Short Hash；Tag = 3.0.0 + Run Number（唯一，不会覆盖老 Release）
      - name: Set version variables
        id: version
        run: |
          set -euo pipefail
          GIT_HASH="$(git rev-parse --short HEAD)"
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "JELLYFIN_VERSION=3.0.0-${GIT_HASH}" >> "$GITHUB_ENV"
          echo "JELLYFIN_TAG=3.0.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Version: 3.0.0-${GIT_HASH} | Tag: 3.0.0-${GITHUB_RUN_NUMBER}"

      - name: Assemble release files
        run: ./gradlew assembleLibreRelease versionTxt --stacktrace

      - name: Sign libre APK
        id: libreSign
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/libre/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release archive
        run: |
          set -euo pipefail
          mkdir -p build/jellyfin-publish
          cp "${{ steps.libreSign.outputs.signedReleaseFile }}" \
            "build/jellyfin-publish/jellyfin-android-v${JELLYFIN_VERSION}-libre-release.apk"
          cp app/build/version.txt build/jellyfin-publish/
          ls -lh build/jellyfin-publish/

      # 生成 Release 正文：版本信息 + 完整提交列表（自上一个 Tag 以来的所有提交）
      - name: Generate release body
        run: |
          set -euo pipefail
          BODY_FILE="build/RELEASE_BODY.md"
          mkdir -p build
          {
            echo '## Jellyfin Android (Libre)'
            echo ''
            echo "- 版本号：\`${JELLYFIN_VERSION}\`"
            echo "- 构建编号：\`${{ github.run_number }}\`"
            echo "- 提交：\`${{ steps.version.outputs.git_hash }}\`"
            echo ''
            echo '## 更新内容（提交记录）'
            echo ''
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            COMMITS=""
            HEADER=""
            if [ -n "$PREV_TAG" ]; then
              COMMITS="$(git log "${PREV_TAG}..HEAD" -n 300 --no-merges --pretty='- `%h` %s (%an)' || true)"
              HEADER="自 \`${PREV_TAG}\` 以来的提交："
            fi
            # 区间为空时回退展示最近提交，避免出现空的提交列表
            if [ -z "$COMMITS" ]; then
              COMMITS="$(git log -n 20 --no-merges --pretty='- `%h` %s (%an)' || true)"
              HEADER="最近提交："
            fi
            echo "$HEADER"
            echo ''
            echo "$COMMITS"
          } > "$BODY_FILE"
          echo "----- Release body -----"
          cat "$BODY_FILE"

      # allowUpdates: false + 唯一 Tag，确保只新建、不覆盖任何历史 Release
      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          allowUpdates: false
          tag: ${{ env.JELLYFIN_TAG }}
          name: "${{ env.JELLYFIN_TAG }} (${{ env.JELLYFIN_VERSION }})"
          bodyPath: build/RELEASE_BODY.md
          artifacts: build/jellyfin-publish/*
