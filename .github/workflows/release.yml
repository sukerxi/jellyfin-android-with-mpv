name: jellyfin-android release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: sukerxi/jellyfin-android
          ref: master
          fetch-depth: 0 # ⬅️ 必须获取完整历史，否则 git rev-parse 可能失败

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ✅ 改动1: 版本号 = 3.0.0 + Git Short Hash
      - name: Set JELLYFIN_VERSION
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "JELLYFIN_VERSION=3.0.0-${GIT_HASH}" >> $GITHUB_ENV
          echo "Version set to 3.0.0-${GIT_HASH}"

      - name: Assemble release files
        run: ./gradlew assembleLibreRelease versionTxt

      - name: Sign libre APK
        id: libreSign
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/libre/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release archive
        run: |
          mkdir -p build/jellyfin-publish
          mv ${{ steps.libreSign.outputs.signedReleaseFile }} build/jellyfin-publish/jellyfin-android-v${{ env.JELLYFIN_VERSION }}-libre-release.apk
          mv app/build/version.txt build/jellyfin-publish/

      # ✅ 改动2: Tag = 3.0.0 + Run Number，保持 Latest
      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          allowUpdates: false       # ⬅️ 每个 Run Number 都是唯一 Tag，不需要 allowUpdates
          tag: "3.0.0-${{ github.run_number }}"
          name: "3.0.0-${{ github.run_number }} (${{ env.JELLYFIN_VERSION }})"
          artifacts: build/jellyfin-publish/*

      # ✅ 改动3: 只保留最近两份 Release，自动删除更早的
      - name: Cleanup old releases
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({
              owner, repo, per_page: 100
            });
            
            // 按创建时间倒序排列，跳过最近的2个
            const sorted = releases.data.sort((a, b) => 
              new Date(b.created_at) - new Date(a.created_at)
            );
            const toDelete = sorted.slice(2);
            
            for (const release of toDelete) {
              console.log(`Deleting release: ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner, repo, release_id: release.id
              });
              // 同时删除对应的 Git Tag
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `tags/${release.tag_name}`
                });
                console.log(`Deleted tag: ${release.tag_name}`);
              } catch (e) {
                console.log(`Tag ${release.tag_name} already deleted or not found`);
              }
            }
            
            console.log(`Cleaned up ${toDelete.length} old release(s). Kept 2 most recent.`);
