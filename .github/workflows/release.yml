name: jellyfin-android release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 发版分支
        required: false
        default: main

# 创建 Release 需要 contents 写权限
permissions:
  contents: write

# 同一时间只允许一个发布任务，排队执行而不是互相抢占
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: sukerxi/jellyfin-android-with-mpv
          # 默认取手动输入的 main，需要时可用其他分支发版。
          # 不用 github.ref 兜底默认分支：GitHub 默认分支可能仍是归档的旧 master。
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0 # 必须获取完整历史，否则 git rev-parse 可能失败

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        # v6 起改用 Node 24 运行时，避免 Node 20 弃用告警
        uses: gradle/actions/setup-gradle@v6

      # 版本号 = 3.0.0 + Git Short Hash；Tag = 3.0.0 + Run Number（唯一，不会覆盖老 Release）
      - name: Set version variables
        id: version
        run: |
          set -euo pipefail
          GIT_HASH="$(git rev-parse --short HEAD)"
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "JELLYFIN_VERSION=3.0.0-${GIT_HASH}" >> "$GITHUB_ENV"
          echo "JELLYFIN_TAG=3.0.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Version: 3.0.0-${GIT_HASH} | Tag: 3.0.0-${GITHUB_RUN_NUMBER}"

      - name: Assemble release files
        run: ./gradlew assembleLibreRelease versionTxt --stacktrace


      - name: Sign libre APK
        id: libreSign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/libre/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "${APK}" ]; then
            echo "未找到 libre release APK" >&2
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(ls -1 "${SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n 1)"

          SIGNED_APK="${APK%.apk}-signed.apk"
          "${APKSIGNER}" sign \
            --ks "${KEYSTORE_FILE}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${SIGNED_APK}" \
            "${APK}"
          "${APKSIGNER}" verify "${SIGNED_APK}"

          echo "signedReleaseFile=${SIGNED_APK}" >> "$GITHUB_OUTPUT"

      - name: Prepare release archive
        run: |
          set -euo pipefail
          mkdir -p build/jellyfin-publish
          cp "${{ steps.libreSign.outputs.signedReleaseFile }}" \
            "build/jellyfin-publish/jellyfin-android-v${JELLYFIN_VERSION}-libre-release.apk"
          cp app/build/version.txt build/jellyfin-publish/
          ls -lh build/jellyfin-publish/

      # 用官方 gh CLI 创建 Release：
      # --generate-notes 生成变更列表，--notes-start-tag 显式指定对比起点（上一个 Release 的 Tag），
      # 避免 GitHub 自动推断上一 Tag 时选错范围。
      # Tag 唯一（含 run number），tag 已存在时 gh 会直接失败，等价于只新建、不覆盖历史 Release
      - name: Create a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"

          ARGS=(
            --target "$(git rev-parse HEAD)"
            --title "${JELLYFIN_TAG} (${JELLYFIN_VERSION})"
            --generate-notes
            --latest
          )
          if [ -n "${PREV_TAG}" ]; then
            echo "上一版本 Tag: ${PREV_TAG}"
            ARGS+=(--notes-start-tag "${PREV_TAG}")
          else
            echo "未找到历史 Release，变更列表从仓库起点开始"
          fi

          gh release create "${JELLYFIN_TAG}" "${ARGS[@]}" build/jellyfin-publish/*
