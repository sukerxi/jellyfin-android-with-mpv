name: jellyfin-android release

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 创建 Release 需要 contents 写权限
permissions:
  contents: write

# 同一时间只允许一个发布任务，排队执行而不是互相抢占
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: sukerxi/jellyfin-android
          ref: master
          fetch-depth: 0 # 必须获取完整历史，否则 git rev-parse 可能失败

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本号 = 3.0.0 + Git Short Hash；Tag = 3.0.0 + Run Number（唯一，不会覆盖老 Release）
      - name: Set version variables
        id: version
        run: |
          set -euo pipefail
          GIT_HASH="$(git rev-parse --short HEAD)"
          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "JELLYFIN_VERSION=3.0.0-${GIT_HASH}" >> "$GITHUB_ENV"
          echo "JELLYFIN_TAG=3.0.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Version: 3.0.0-${GIT_HASH} | Tag: 3.0.0-${GITHUB_RUN_NUMBER}"

      - name: Assemble release files
        run: ./gradlew assembleLibreRelease versionTxt --stacktrace

      - name: Sign libre APK
        id: libreSign
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/libre/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release archive
        run: |
          set -euo pipefail
          mkdir -p build/jellyfin-publish
          cp "${{ steps.libreSign.outputs.signedReleaseFile }}" \
            "build/jellyfin-publish/jellyfin-android-v${JELLYFIN_VERSION}-libre-release.apk"
          cp app/build/version.txt build/jellyfin-publish/
          ls -lh build/jellyfin-publish/

      # allowUpdates: false + 唯一 Tag，确保只新建、不覆盖任何历史 Release
      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          allowUpdates: false
          tag: ${{ env.JELLYFIN_TAG }}
          name: "${{ env.JELLYFIN_TAG }} (${{ env.JELLYFIN_VERSION }})"
          body: |
            ## Jellyfin Android (Libre)

            - 版本号：`${{ env.JELLYFIN_VERSION }}`
            - 构建编号：`${{ github.run_number }}`
            - 提交：`${{ steps.version.outputs.git_hash }}`
          generateReleaseNotes: true # 自动附加两个 Tag 之间的提交记录
          artifacts: build/jellyfin-publish/*
