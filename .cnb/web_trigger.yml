# CNB 手动触发按钮配置（在对应分支详情页显示）。
# 按钮触发的 web_trigger 事件流水线定义在根目录 .cnb.yml 中。

branch:
  - reg: ^main$
    buttons:
      - name: 发布 Nightly
        description: 手动触发一次 main 构建并发布 Nightly Release（tag 为 3.0.0-<构建号>）
        event: web_trigger_release
        groupName: 发布
      - name: 清理旧 Release
        description: 立即执行一次 Release 清理，只保留最近 10 条 nightly Release（正式 v* 不受影响）
        event: web_trigger_prune
        groupName: 发布
      - name: 触发 GitHub Release
        description: 调用 GitHub API 触发 jellyfin-android release workflow，在 GitHub 侧构建并创建 Release（与 CNB Nightly 相互独立）
        event: web_trigger_github_release
        groupName: 发布
        inputs:
          GH_RELEASE_REF:
            name: 发版分支 / Tag
            description: 传给 GitHub workflow 的 ref 输入，决定 checkout 哪份代码；默认 main
            type: input
            required: true
            default: "main"
        permissions:
          roles:
            - owner
            - master
