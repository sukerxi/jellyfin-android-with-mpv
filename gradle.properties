# Gradle
org.gradle.jvmargs=-Xmx2048m

# 依赖下载重试：Gradle 默认不重试，HTTP 429/5xx 会直接判失败。
# 共享出口下 Maven Central 偶发 429（见 cnb-55v-1k4l8999k），
# 开启重试后这类瞬时错误可自动恢复，不再让整条流水线飘红。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default
