# Gradle
org.gradle.jvmargs=-Xmx2048m

# 依赖下载重试：共享出口下公共源（Maven Central、各云镜像）会返回 429 Too Many
# Requests，Gradle 把它归类为「瞬时网络错误」并自动重试，默认最多 3 次尝试
# （max.tentatives=3），退避 1s 起指数增长。见构建 cnb-55v-1k4l8999k、
# cnb-noh-1k4t7eu99：退避窗口太短，重试完仍撞在限流上，整条流水线飘红。
# 这里把尝试次数提到 8 次（末次退避 64s，总窗口约 2 分钟），让限流自愈。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default
