# CNB (cnb.cool) 云原生构建流水线，由 .github/workflows/ 下的 GitHub Actions 改造而来。
# GitHub Actions 配置全部保留不变；本文件仅在 CNB 平台生效。
#
# 流水线对应关系：
#   .github/workflows/app-build.yaml       -> ci 流水线（assembleDebug），master / release-* push 与所有 PR
#   .github/workflows/app-test.yaml        -> ci 流水线（./gradlew test）
#   .github/workflows/app-lint.yaml        -> ci 流水线（./gradlew detekt lint；SARIF 上传为 GitHub 专有，未迁移）
#   .github/workflows/gradlew-validate.yaml-> 依赖 GitHub 官方 Action，CNB 无等价物，未迁移
#   .github/workflows/release.yml          -> nightly-release 流水线（master push + 「发布 Nightly」按钮）
#   .github/workflows/app-publish.yaml     -> release 流水线（推送 v* tag 触发）
#   .github/workflows/repo-*.yaml          -> GitHub 机器人（triage/stale/merge-conflict），与 CNB 无关，未迁移
#
# 手动按钮定义见 .cnb/web_trigger.yml（在 master 分支详情页显示）。
#
# Nightly 发版（对应 release.yml）:
#   每次推送到 master：版本号 3.0.0-<提交短哈希>，自动创建唯一 tag
#   3.0.0-<CNB 构建号> 与 CNB Release，并上传 libre release APK + version.txt 作为附件。
#   与 GitHub 版差异：直接构建当前仓库（GitHub 版跨仓库 checkout sukerxi/jellyfin-android）。
#
# 正式发版（对应 app-publish.yaml）:
#   推送 vX.Y.Z 形式的 tag 即自动构建全部 APK/AAB，创建同名 CNB Release 并上传附件。
#
# Release 签名（可选）：
#   未配置签名密钥时 release 产物为未签名包（AGP 默认行为，流水线不会失败）。
#   如需签名，请在「密钥仓库」创建 android.yml（不要提交到本仓库）：
#     KEYSTORE: <keystore.jks 的 base64 内容>
#     KEYSTORE_PASSWORD: <keystore 密码>
#     KEY_ALIAS: <key alias>
#     KEY_PASSWORD: <key 密码>
#   然后在下方 nightly-release / release 流水线中取消 imports 注释并改成你的密钥仓库地址：
#     imports:
#       - https://cnb.cool/sukerxi/<你的密钥仓库>/-/blob/master/android.yml
#
# 同步到 repo.jellyfin.org（可选，对应 app-publish.yaml 最后两步）：
#   在密钥仓库增加 deploy.yml（REPO_HOST / REPO_USER / REPO_KEY 私钥），
#   并在 release 流水线的 imports 中追加该文件；未配置时自动跳过。
#
# 同步到 GitHub（master push 即触发，见 sync-github 流水线）：
#   需在密钥仓库（sukerxi/secrets main 分支）创建 github.yml：
#     GH_USERNAME: <GitHub 用户名>
#     GH_TOKEN: <GitHub PAT>
#   目标仓库需已存在（空仓库即可），force push 使 GitHub master 与 CNB master 保持一致。
#
#   【Token 权限】本仓库会推送 .github/workflows/ 下的文件，PAT 必须带 workflow 权限：
#     - 经典 PAT（classic）：勾选 repo + workflow 两个 scope
#     - Fine-grained PAT：Repository permissions → Contents: Read and write
#                         + Workflows: Read and write（缺了会在推送 workflow 文件时报
#                           refusing to allow a Personal Access Token to create or update workflow）
#   注意：同步内容包含 .github/workflows/，GitHub 侧 Actions 会被推送触发；
#   如不希望 GitHub 跑 CI/发版，请在 GitHub 仓库 Settings → Actions 中关闭流水线。

# 关于并发与锁：流水线默认无锁、可并发；需要串行的用
#   lock: { key: <名字>, wait: true, timeout: <秒> }
# 不要用 `lock: true`——它是「非等待锁」，锁被占用时后触发的构建会在 Prepare 阶段
# 直接失败并抛错：The lock (xxx) is occupied and the current process is terminated.
# 这正是 cnb-k5v-1k4f86k2a 的失败原因。wait 有上限：等待超时同样会失败（详见下方发版锁）。

# ============================== 共享配置（锚点复用） ==============================

# JDK 21（见 .tools-versions）+ Gradle 9.7.1 + AGP 9.x / compileSdk 37 的构建环境。
# Android SDK 在「准备 Android SDK」阶段按需安装到数据卷，首次构建后跨流水线缓存复用。
.android-docker: &android-docker
  image: eclipse-temurin:21-jdk-noble
  volumes:
    # Gradle 依赖与 wrapper 发行包缓存
    - /root/.gradle:copy-on-write
    # Android SDK 缓存
    - /opt/android-sdk:copy-on-write

.android-env: &android-env
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_HOME: /opt/android-sdk

# 所有流水线共用的环境准备阶段
.setup-stage: &setup-stage
  name: 准备 Android SDK
  script: |
    set -e
    chmod +x ./gradlew
    # Android 17（API 37）起平台包采用小版本号（platforms;android-37.0），
    # 旧版 cmdline-tools（11076708）无法识别，需使用 13114758 或更新版本。
    # 用版本标记文件做守卫：数据卷里缓存的旧版 cmdline-tools 会被强制重装一次。
    CMDLINE_TOOLS_BUILD=13114758
    if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/.ready-$CMDLINE_TOOLS_BUILD" ]; then
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl unzip
      install -d "$ANDROID_SDK_ROOT/cmdline-tools"
      rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      curl -fsSL -o /tmp/cmdline-tools.zip \
        "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip"
      unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
      mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
         "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      rm -f /tmp/cmdline-tools.zip
      touch "$ANDROID_SDK_ROOT/cmdline-tools/.ready-$CMDLINE_TOOLS_BUILD"
    fi
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    yes | sdkmanager --licenses > /dev/null
    sdkmanager --install \
      "platform-tools" \
      "platforms;android-37.0" \
      "build-tools;37.0.0"
    echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    sdkmanager --version

# 存在签名密钥（密钥仓库导入的 $KEYSTORE）时解码为 keystore.jks
.decode-keystore-stage: &decode-keystore-stage
  name: 解码签名密钥
  if: test -n "$KEYSTORE"
  script: |
    set -e
    echo "$KEYSTORE" | base64 -d > keystore.jks
    test -s keystore.jks
    echo "已解码 keystore.jks ($(stat -c%s keystore.jks) bytes)"

# 生成 Release 更新内容：自上一个 Tag 以来的所有提交，压成单行（<br> 分隔）。
# CNB 的 git:release description 只接受单行字符串，因此换行统一转成 <br>。
# 导出为环境变量 RELEASE_BODY，供后续「创建 CNB Release」的 description 插值使用。
# 注意：CNB 检出可能是浅克隆，先补全历史与 Tag；失败不阻断流水线（仅丢失提交列表）。
.changelog-stage: &changelog-stage
  name: 生成更新内容
  exports:
    body: RELEASE_BODY
  script: |
    set -e
    # 构建镜像 eclipse-temurin 基于 Ubuntu，默认不含 git；缺 git 则安装并放行可疑属主。
    # 为定位「两条 Release 提交列表雷同（区间未生效、走了最近提交兜底）」问题，本轮把环境
    # 探测 $DIAG 常驻附加到 Release 正文末尾（relapi=releases API 响应字节数，为后续改用
    # API 取上一 tag 铺路），定案后移除。
    DIAG="git=missing"
    if ! command -v git >/dev/null 2>&1; then
      apt-get update -qq >/dev/null 2>&1 || true
      apt-get install -y -qq git >/dev/null 2>&1 || true
    fi
    if command -v git >/dev/null 2>&1; then
      git config --global --add safe.directory '*' >/dev/null 2>&1 || true
      DIAG="git=ok"
      DIAG="$DIAG shallow=$(git rev-parse --is-shallow-repository 2>/dev/null || echo q)"
      DIAG="$DIAG remotes=$(git remote 2>/dev/null | tr '\n' '/' | sed 's|/$||')"
      git fetch --unshallow > /dev/null 2>&1 || git fetch --deepen=500 > /dev/null 2>&1 || true
      DIAG="$DIAG n=$(git rev-list --count HEAD 2>/dev/null || echo q)"
      # 遍历所有 remote 拉取 tag（此前硬编码 origin，若 CNB 检出 remote 名不同则永远拉不到，
      # describe 找不到上一 nightly tag，区间失效、恒走「最近提交」兜底 → 相邻 Release 雷同）
      TAGFETCH=fail
      for R in $(git remote 2>/dev/null); do
        if git fetch --tags --force --prune "$R" '+refs/tags/*:refs/tags/*' > /dev/null 2>&1; then TAGFETCH="ok-$R"; break; fi
      done
      if [ "$TAGFETCH" = fail ]; then
        if git fetch --tags --force > /dev/null 2>&1; then TAGFETCH=ok-default; fi
      fi
      DIAG="$DIAG tagfetch=$TAGFETCH"
      DIAG="$DIAG tags=$(git tag -l 2>/dev/null | wc -l | tr -d ' ')"
      RSPL="$(curl -fsS -m 10 -H 'Accept: application/vnd.cnb.api+json' -H "Authorization: Bearer ${CNB_TOKEN}" "${CNB_API_ENDPOINT:-https://api.cnb.cool}/${CNB_REPO_SLUG}/-/releases?limit=2" 2>/dev/null | head -c 200 || true)"
      DIAG="$DIAG relapi=${#RSPL}"
    fi
    PREV_TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
    DIAG="$DIAG describe=${PREV_TAG:-none}"
    # tag_push 场景下 HEAD 自身即触发 Tag，需回退到上一个 Tag，否则区间为空
    if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "$CNB_BRANCH" ]; then
      PREV_TAG="$(git describe --tags --abbrev=0 "${CNB_BRANCH}^" 2>/dev/null || true)"
    fi
    # 不使用 --no-merges：GitHub 同步会产生 merge commit，过滤后可能整段区间为空。
    if [ -n "$PREV_TAG" ]; then
      COMMITS="$(git log "${PREV_TAG}..HEAD" -n 300 --pretty='- `%h` %s (%an)' 2>/dev/null | sed 's/$/<br>/' | tr -d '\n')"
      HEADER="自 ${PREV_TAG} 以来的提交：<br>"
    else
      COMMITS=""
      HEADER=""
    fi
    # 区间为空（标签未取全、HEAD 即最新 tag、或本次无新增提交）时，
    # 回退展示最近若干条提交，避免出现「无新增提交或历史不可用」。
    if [ -z "$COMMITS" ]; then
      COMMITS="$(git log -n 20 --pretty='- `%h` %s (%an)' 2>/dev/null | sed 's/$/<br>/' | tr -d '\n')"
      HEADER="最近提交：<br>"
    fi
    if [ -z "$COMMITS" ]; then
      COMMITS="（暂无提交记录）<br>"
      HEADER=""
    fi
    # 正文是单行 <br> 拼接，块级语法（## 标题）在 <br> 之后不在行首不会渲染，改用行内加粗；
    # 诊断信息附在正文末尾，无需打开流水线日志即可定位（定案后移除）
    BODY="**更新内容（提交记录）**<br><br>${HEADER}${COMMITS}<br>（诊断: ${DIAG}）"
    echo "CHANGELOG-DIAG: ${DIAG}"
    # 方括号会破坏 ##[set-output ...] 指令解析，提交信息中的方括号统一去掉
    BODY="$(printf '%s' "$BODY" | tr -d '[]')"
    echo "更新内容长度: ${#BODY}"
    echo "##[set-output body=$BODY]"


# ============================== Nightly 发版（对应 release.yml） ==============================

.nightly-pipeline: &nightly-pipeline
  name: nightly-release
  # 同一分支上的发版串行执行（对应 GitHub workflow 的 concurrency 配置）。
  # 必须用 wait: true 排队：`lock: true` 是非等待锁，锁被占用时后触发的构建会在
  # Prepare 阶段直接失败（见 cnb-k5v-1k4f86k2a）。
  # 单次构建约 3~5 分钟，等待上限设为 600s，可覆盖 1~2 个构建排队；
  # 等待超时同样会失败，因此应避免密集连推 master（同步 GitHub 的流水线走独立锁，不受影响）。
  lock:
    key: nightly-release
    wait: true
    timeout: 600
  docker: *android-docker
  env: *android-env
  imports:
    - https://cnb.cool/sukerxi/secrets/-/blob/main/android.yml
  stages:
    - *setup-stage

    # 版本号 = 3.0.0 + 提交短哈希；Tag = 3.0.0 + CNB 构建号（全局唯一，不会覆盖历史 Release）
    - name: 设置版本变量
      script: |
        VERSION="3.0.0-${CNB_COMMIT_SHORT}"
        TAG="3.0.0-${CNB_BUILD_ID}"
        echo "Version: ${VERSION} | Tag: ${TAG} | Commit: ${CNB_COMMIT}"
        echo "##[set-output version=$VERSION]"
        echo "##[set-output tag=$TAG]"
      exports:
        version: JELLYFIN_VERSION
        tag: NIGHTLY_TAG

    - *changelog-stage

    - *decode-keystore-stage

    - name: 构建 libre release
      script: |
        set -e
        if [ -f keystore.jks ]; then
          export KEYSTORE_FILE="$PWD/keystore.jks"
          export KEYSTORE_PASSWORD
          export SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
        else
          echo "未配置签名密钥（KEYSTORE），产出未签名 APK"
        fi
        ./gradlew --no-daemon --console=plain assembleLibreRelease versionTxt --stacktrace

    - name: 整理发布产物
      script: |
        set -e
        mkdir -p build/cnb-nightly
        APK="$(find app/build/outputs/apk/libre/release -type f -name '*.apk' | head -n 1)"
        cp "$APK" "build/cnb-nightly/jellyfin-android-v${JELLYFIN_VERSION}-libre-release.apk"
        cp app/build/version.txt build/cnb-nightly/
        ls -lh build/cnb-nightly/

    - name: 创建发版 Tag
      script: |
        set -e
        api="${CNB_API_ENDPOINT:-https://api.cnb.cool}/${CNB_REPO_SLUG}"
        auth="Authorization: Bearer ${CNB_TOKEN}"
        # CNB OPENAPI 强制要求该 Accept 头，缺失会返回 406
        accept="Accept: application/vnd.cnb.api+json"
        echo "在 $CNB_COMMIT 上创建 Tag: $NIGHTLY_TAG"
        payload=$(printf '{"name":"%s","message":"Nightly %s","target":"%s"}' \
          "$NIGHTLY_TAG" "$NIGHTLY_TAG" "$CNB_COMMIT")
        curl -fsS -X POST \
          -H "$accept" \
          -H "$auth" \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "$api/-/git/tags"

    - name: 创建 CNB Release
      type: git:release
      options:
        tag: $NIGHTLY_TAG
        title: "${NIGHTLY_TAG} (${JELLYFIN_VERSION})"
        # RELEASE_BODY 由「生成更新内容」阶段导出（单行、<br> 分隔的提交列表）
        description: "## Jellyfin Android with MPV (Libre) 自动构建<br><br>- 版本号：`${JELLYFIN_VERSION}`<br>- 构建编号：`${CNB_BUILD_ID}`<br>- 提交：`${CNB_COMMIT}`<br><br>${RELEASE_BODY}"
        latest: true

    # 附件插件需在单个 Job 默认超时（60s）内完成；大体积 APK 上传易超时，显式放宽到 10 分钟。
    - name: 上传 Release 附件
      image: cnbcool/attachments:latest
      timeout: 10m
      settings:
        tag: $NIGHTLY_TAG
        attachments:
          - ./build/cnb-nightly/*.apk
          - ./build/cnb-nightly/version.txt

# ============================== 正式发版（对应 app-publish.yaml） ==============================

.publish-pipeline: &publish-pipeline
  name: release
  docker: *android-docker
  env: *android-env
  # 如需同步 repo.jellyfin.org，配置 deploy.yml 后在 imports 中追加：
  #   - https://cnb.cool/sukerxi/secrets/-/blob/master/deploy.yml
  imports:
    - https://cnb.cool/sukerxi/secrets/-/blob/main/android.yml
  stages:
    - *setup-stage

    # 版本号取 tag 名并去掉 v 前缀（v2.0.0 -> 2.0.0）
    - name: 设置版本变量
      script: |
        VERSION="${CNB_BRANCH#v}"
        echo "Release 版本: $VERSION (tag: $CNB_BRANCH)"
        echo "##[set-output version=$VERSION]"
      exports:
        version: JELLYFIN_VERSION

    - *changelog-stage

    - *decode-keystore-stage

    - name: 构建全部 Release 产物
      script: |
        set -e
        if [ -f keystore.jks ]; then
          export KEYSTORE_FILE="$PWD/keystore.jks"
          export KEYSTORE_PASSWORD
          export SIGNING_KEY_ALIAS="$KEY_ALIAS"
          export SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
        else
          echo "未配置签名密钥（KEYSTORE），产出未签名 APK/AAB"
        fi
        ./gradlew --no-daemon --console=plain assemble bundleRelease versionTxt --stacktrace

    - name: 整理发布产物
      script: |
        set -e
        mkdir -p build/cnb-publish
        find app/build/outputs/apk -type f -iname "*.apk" -exec cp {} build/cnb-publish/ \;
        find app/build/outputs/bundle -type f -iname "*.aab" -exec cp {} build/cnb-publish/ \;
        cp app/build/version.txt build/cnb-publish/
        ls -lh build/cnb-publish/

    # tag_push 事件下无需传 tag，自动取触发事件的 tag 名
    - name: 创建 CNB Release
      type: git:release
      options:
        title: $CNB_BRANCH
        # RELEASE_BODY 由「生成更新内容」阶段导出（单行、<br> 分隔的提交列表）
        description: "## Jellyfin Android with MPV $CNB_BRANCH<br><br>${RELEASE_BODY}"
        latest: true

    # 附件插件需在单个 Job 默认超时（60s）内完成；多个 APK/AAB 上传易超时，显式放宽到 10 分钟。
    - name: 上传 Release 附件
      image: cnbcool/attachments:latest
      timeout: 10m
      settings:
        attachments:
          - ./build/cnb-publish/*.apk
          - ./build/cnb-publish/*.aab
          - ./build/cnb-publish/version.txt

    # 以下两步对应 app-publish.yaml 中上传 repo.jellyfin.org 的逻辑，
    # 仅在密钥仓库提供 REPO_HOST / REPO_USER / REPO_KEY 时执行，否则自动跳过。
    - name: 配置部署 SSH
      if: test -n "$REPO_HOST" -a -n "$REPO_USER" -a -n "$REPO_KEY"
      script: |
        set -e
        apt-get update
        apt-get install -y --no-install-recommends openssh-client rsync
        mkdir -p ~/.ssh
        printf '%s' "$REPO_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: 上传发布产物到 repo.jellyfin.org
      if: test -n "$REPO_HOST" -a -n "$REPO_USER" -a -f "$HOME/.ssh/id_rsa"
      script: |
        set -e
        rsync -vrptz \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          build/cnb-publish/ \
          "${REPO_USER}@${REPO_HOST}:/srv/incoming/android/v${JELLYFIN_VERSION}/"

    - name: 更新 repo.jellyfin.org 软链接
      if: test -n "$REPO_HOST" -a -n "$REPO_USER" -a -f "$HOME/.ssh/id_rsa"
      script: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
          "${REPO_USER}@${REPO_HOST}" "bash -s" <<EOF
          if [ -d "/srv/repository/main/client/android/versions/v${JELLYFIN_VERSION}" ] && [ -n "${JELLYFIN_VERSION}" ]; then
              sudo rm -r /srv/repository/main/client/android/versions/v${JELLYFIN_VERSION}
          fi
          sudo mv /srv/incoming/android/v${JELLYFIN_VERSION} /srv/repository/main/client/android/versions/v${JELLYFIN_VERSION}
          cd /srv/repository/main/client/android
          sudo rm -rf *.apk version.txt
          sudo ln -s versions/v${JELLYFIN_VERSION}/jellyfin-android-v${JELLYFIN_VERSION}-*.apk .
          sudo ln -s versions/v${JELLYFIN_VERSION}/version.txt .
        EOF

# ============================== 同步 master 到 GitHub ==============================

# push 即同步：master 每次推送后用 git-sync 插件强推到 GitHub 镜像仓库（仅 master 分支）。
# 与 nightly-release 并行执行，同步失败不影响发版。
# 独立锁 key 保证多次连续推送串行同步（避免并发 force push 互相覆盖），且不与 nightly 抢锁。
.sync-github-pipeline: &sync-github-pipeline
  name: sync-github
  lock:
    key: sync-github
    wait: true
    timeout: 300
  imports:
    - https://cnb.cool/sukerxi/secrets/-/blob/main/github.yml
  stages:
    - name: Sync master to GitHub
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/sukerxi/jellyfin-android-with-mpv.git
        auth_type: https
        username: ${GH_USERNAME}
        password: ${GH_TOKEN}
        branch: master
        force: true
      # 该 Job 失败不阻断流水线（镜像同步是旁路，不应把整条 master 流水线拖红）。
      # 失败时最常见的原因是 PAT 缺少 workflow 权限，被 GitHub 拒绝推送 .github/workflows/，
      # 报错形如：refusing to allow a Personal Access Token to create or update workflow。
      allowFailure: true

# ============================== 事件绑定 ==============================

master:
  push:
    # 每次推送 master 自动发一个 Nightly Release（对应 release.yml）
    - *nightly-pipeline
    # 每次推送 master 实时同步到 GitHub 镜像仓库
    - *sync-github-pipeline
  # master 分支详情页「发布 Nightly」按钮（对应 release.yml 的 workflow_dispatch）
  web_trigger_release:
    - *nightly-pipeline

# 推送 v* tag 触发正式发版（对应 app-publish.yaml）
"v*":
  tag_push:
    - *publish-pipeline
